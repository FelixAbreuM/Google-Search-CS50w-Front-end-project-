<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Images</title>
    <link rel="stylesheet" href="/css/images-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <div class="navigation">
        <div class="external-links">
            <a href="https://about.google/" class="navigation-link">About</a>
            <a href="https://store.google.com/us/" class="navigation-link">Store</a> 
        </div>
        <div class="internal-links">
            <a href="/index.html" class="navigation-link">Search</a>
            <a href="/advanced-search.html" class="navigation-link">Advanced Search</a>  
        </div>
    </div>
    <!-- form section -->
     <div class="search">
        <div class="search-title">
            <img src="/img/google-logo.png" alt="google-logo" class="google-logo">
            <p>Images</p>
        </div>
        <div class="search-form">
            <form action="https://www.google.com/imghp">
                <div class="user-input-container">
                    <div class="search-icon-container">
                        <button type="submit" class="search-icon"><span class="material-symbols-outlined">search</span></button>
                    </div>
                    <div class="input-container">
                        <input type="text" name="q" class="user-input">    
                    </div>
                </div>
                
                <div class="submit-buttons">
                    <button type="submit" name="btnK" value="Google Search">Google Search</button>
                </div>
            </form>
        </div>
    </div>

     <!-- footer section -->
    <div class="footer">
        <div class="section-1">
            <a href="https://business.google.com/us/google-ads/" class="navigation-link">Advertising</a>
            <a href="https://business.google.com/us/business-profile/" class="footer-link">Business</a>
            <a href="https://www.google.com/search/howsearchworks/" class="footer-link">How Search works</a>
        </div>
        <div class="section-3">
            <a href="https://policies.google.com/privacy" class="footer-link">Privacy</a>
            <a href="https://policies.google.com/terms" class="footer-link">Terms</a>   
            <a href="/advanced-search.html" class="footer-link">Advanced Search</a>  
        </div>
    </div>

</body>
</html>
